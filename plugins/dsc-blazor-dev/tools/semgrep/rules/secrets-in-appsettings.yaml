rules:
  - id: dsc-secret-in-appsettings
    languages: [regex]
    severity: ERROR
    message: >-
      A secret value is committed in a settings file. Anyone with read access to the repository
      (and every build artifact) gets it. Keep the key with an empty value or a placeholder and
      load the real value from Azure Key Vault, App Service / Function App settings, or
      dotnet user-secrets in development. Rotate the exposed secret.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
      confidence: MEDIUM
    paths:
      include:
        - "appsettings*.json"
        - "local.settings.json"
        - "secrets*.json"
        - "*.secrets.json"
    pattern-regex: >-
      (?i)"[\w.:-]*(password|passwd|pwd|secret|apikey|api_key|accesskey|accountkey|sharedaccesskey|clientsecret|privatekey|token)[\w.:-]*"\s*:\s*"(?!\s*"|https?://|<|\{\{|\$\{|#\{|__|\*+"|changeme|placeholder|todo|use-?keyvault|@Microsoft\.KeyVault)[^"]{6,}"
  - id: dsc-connection-string-secret
    languages: [regex]
    severity: ERROR
    message: >-
      A connection string in a settings file carries a password or key. Use Managed Identity
      (Authentication=Active Directory Default) for SQL and Storage, or a Key Vault reference,
      and leave only the non-secret parts in the file. Rotate the exposed secret.
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    paths:
      include:
        - "appsettings*.json"
        - "local.settings.json"
        - "secrets*.json"
        - "*.secrets.json"
    pattern-regex: (?i)\b(password|pwd|accountkey|sharedaccesskey)\s*=\s*(?!\s*[;"]|<|\{\{|\$\{|#\{|__)[^;"]{4,}
